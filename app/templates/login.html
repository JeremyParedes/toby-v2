<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Banco Toby</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        /* fondo moderno */
        background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
    }

    form {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 30px;
        border-radius: 16px;
        width: 300px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.2);
        text-align: center;
    }

    h2 {
        color: white;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: none;
        border-radius: 10px;
        outline: none;
        background: rgba(255,255,255,0.2);
        color: white;
    }

    input::placeholder {
        color: rgba(255,255,255,0.7);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #4f46e5;
    }

    a {
        display: block;
        margin-top: 15px;
        color: #a5b4fc;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>

<form method="post" action="/login">
    <h2>🏦 Banco Toby</h2>

    <input type="text" name="username" placeholder="Usuario" required>
    <input type="password" name="password" placeholder="Contraseña" required>

    <button type="submit">Entrar</button>

    <a href="/banco">Ir al Banco</a>
</form>

</body>
</html>
