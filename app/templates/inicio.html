    document.getElementById("clock-date").innerHTML =

}

setInterval(actualizarRelojHUD, 1000);
actualizarRelojHUD();

function hablar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-ES";
    voz.rate = 1;
    speechSynthesis.speak(voz);
}

const reconocimiento =
    new (window.SpeechRecognition || window.webkitSpeechRecognition)();

reconocimiento.lang = "es-ES";
reconocimiento.continuous = false;
reconocimiento.interimResults = false;

reconocimiento.onresult = async function(event) {

    const texto = event.results[0][0].transcript;
    console.log("Usuario:", texto);

    // 🔥 comandos primero
    const esComando = ejecutarComando(texto);

    if (esComando) return;

    // 🤖 IA
    try {

    const respuesta = await fetch("/ia", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensaje: texto })
    });

            const data = await respuesta.json();

            hablar(data.respuesta);

        } catch (error) {
            console.log("Error IA:", error);
            hablar("Error en IA");
        }

    const data = await respuesta.json();

    hablar(data.respuesta);
};

const btn = document.getElementById("btnAsistente");

btn.addEventListener("click", () => {
    reconocimiento.start();
});

reconocimiento.onstart = () => {
    document.body.classList.add("listening");
};

reconocimiento.onend = () => {
    document.body.classList.remove("listening");
    console.log("mic cerrado");
};

async function ejecutarComando(texto) {

    texto = texto.toLowerCase();

    if (texto.includes("reproduce") && texto.includes("youtube")) {

        let query = texto;

        // 🧠 limpieza básica
        query = query
            .replace(/reproduce|youtube|en|la|el|de|música|musica|ahora|pon|quiero/gi, "")
            .trim();

        // 🧠 detección de intención
        if (texto.includes("mejor")) query += " mix";
        if (texto.includes("triste")) query += " sad playlist";
        if (texto.includes("motivar")) query += " motivation";
        if (texto.includes("relaj")) query += " chill music";
        if (texto.includes("bad bunny")) query += " official audio";
        if (texto.includes("canserbero")) query += " lyrics";

        const respuesta = await fetch("/youtube-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query })
        });

        const data = await respuesta.json();

        window.open(data.video_url, "_blank");

        return true;
    }

    return false;
}
