setInterval(actualizarRelojHUD, 1000);

/* =========================
   HABLAR
========================== */

function hablar(texto) {
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-ES";
    voz.rate = 1;
    speechSynthesis.speak(voz);
}


/* =========================
   VOZ
========================== */

const reconocimiento =
    new (window.SpeechRecognition || window.webkitSpeechRecognition)();

reconocimiento.lang = "es-ES";
reconocimiento.continuous = false;
reconocimiento.interimResults = false;

reconocimiento.onresult = async function(event) {

    const texto = event.results[0][0].transcript;

    console.log("Usuario:", texto);

    const respuesta = await fetch("/ia", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensaje: texto })
    });

    const data = await respuesta.json();

    hablar(data.respuesta);
};


/* =========================
   BOTÓN
========================== */

document.getElementById("btnAsistente")
.addEventListener("click", () => {
    reconocimiento.start();
});

const btn = document.getElementById("btnAsistente");

reconocimiento.onstart = () => {
    document.body.classList.add("listening");
};

reconocimiento.onend = () => {
    document.body.classList.remove("listening");
};

btn.addEventListener("click", () => {
    reconocimiento.start();
});

function ejecutarComando(texto) {

    texto = texto.toLowerCase();

    // 🎵 YouTube con búsqueda
    if (texto.includes("youtube")) {

        // quitamos palabras inútiles
        let busqueda = texto
            .replace("youtube", "")
            .replace("reproduce", "")
            .replace("pon", "")
            .trim();

        if (busqueda.length === 0) {
            window.open("https://youtube.com", "_blank");
        } else {
            window.open(
                `https://www.youtube.com/results?search_query=${encodeURIComponent(busqueda)}`,
                "_blank"
            );
        }

        return true;
    }

    if (texto.includes("google")) {
        window.open("https://google.com", "_blank");
        return true;
    }

    return false;
}

reconocimiento.onresult = async function(event) {

    const texto = event.results[0][0].transcript;

    console.log("Usuario:", texto);

    // 👉 comandos locales primero
    const ejecutado = ejecutarComando(texto);
    if (ejecutado) return;

    const respuesta = await fetch("/ia", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensaje: texto })
    });

    const data = await respuesta.json();

    hablar(data.respuesta);
};


</script>
